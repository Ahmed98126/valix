<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Valix</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-gray-50 via-gray-100 to-gray-200 flex items-center justify-center p-4">
    <!-- Background decoration -->
    <div class="absolute inset-0 overflow-hidden pointer-events-none">
        <div class="absolute top-20 right-20 w-96 h-96 bg-blue-500/5 rounded-full blur-3xl"></div>
        <div class="absolute bottom-20 left-20 w-96 h-96 bg-purple-500/5 rounded-full blur-3xl"></div>
    </div>

    <div class="relative z-10 w-full max-w-md">
        <!-- Header -->
        <div class="text-center mb-12">
            <div class="flex justify-center mb-4">
                <div class="w-12 h-12 bg-blue-600 rounded-lg flex items-center justify-center shadow-lg">
                    <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                    </svg>
                </div>
            </div>
            <h1 class="text-3xl font-bold text-gray-900 mb-2">Create Account</h1>
            <p class="text-gray-600 text-sm">Sign up to start validating invoices</p>
        </div>

        <!-- Signup Card -->
        <div class="bg-white p-8 rounded-lg shadow-lg border border-gray-200">
            {% if error %}
            <div class="mb-4 p-3 bg-red-50 border border-red-200 rounded text-red-700 text-sm">
                {{ error }}
            </div>
            {% endif %}

            <form method="POST" action="/signup" class="space-y-4">
                {% if tenants and tenants|length > 0 %}
                <div>
                    <label class="text-sm font-medium text-gray-700 mb-1.5 block">Organization</label>
                    <select
                        name="tenant_slug"
                        id="tenant_select"
                        class="w-full h-10 px-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent bg-white"
                        onchange="toggleNewTenant()"
                    >
                        <option value="">Select existing organization...</option>
                        {% for tenant in tenants %}
                        <option value="{{ tenant.slug }}">{{ tenant.name }}</option>
                        {% endfor %}
                        <option value="__new__">+ Create New Organization</option>
                    </select>
                </div>
                <div id="new_tenant_div" style="display: none;">
                    <label class="text-sm font-medium text-gray-700 mb-1.5 block">New Organization Name</label>
                    <input
                        type="text"
                        name="new_tenant_name"
                        id="new_tenant_name"
                        placeholder="My Company Ltd"
                        class="w-full h-10 px-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                    />
                    <p class="text-xs text-gray-500 mt-1">Enter the name of your organization</p>
                </div>
                {% else %}
                <div>
                    <label class="text-sm font-medium text-gray-700 mb-1.5 block">Organization Name</label>
                    <input
                        type="text"
                        name="new_tenant_name"
                        placeholder="My Company Ltd"
                        required
                        class="w-full h-10 px-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                    />
                    <p class="text-xs text-gray-500 mt-1">Enter the name of your organization</p>
                </div>
                {% endif %}
                
                <div>
                    <label class="text-sm font-medium text-gray-700 mb-1.5 block">Full Name (Optional)</label>
                    <input
                        type="text"
                        name="full_name"
                        placeholder="John Doe"
                        class="w-full h-10 px-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                    />
                </div>
                <div>
                    <label class="text-sm font-medium text-gray-700 mb-1.5 block">Email Address</label>
                    <input
                        type="email"
                        name="email"
                        placeholder="you@company.com"
                        required
                        class="w-full h-10 px-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                    />
                </div>
                <div>
                    <label class="text-sm font-medium text-gray-700 mb-1.5 block">Password</label>
                    <input
                        type="password"
                        name="password"
                        placeholder="••••••••"
                        required
                        minlength="6"
                        class="w-full h-10 px-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                    />
                </div>
                <button
                    type="submit"
                    class="w-full h-10 mt-6 bg-blue-600 text-white font-medium rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 transition-colors"
                >
                    Sign Up
                </button>
            </form>

            <div class="mt-6 pt-6 border-t border-gray-200">
                <p class="text-xs text-gray-500 text-center">Already have an account? <a href="/login" class="text-blue-600 hover:underline">Sign in</a></p>
            </div>
        </div>
    </div>
    
    <script>
        function toggleNewTenant() {
            const select = document.getElementById('tenant_select');
            const newTenantDiv = document.getElementById('new_tenant_div');
            const newTenantInput = document.getElementById('new_tenant_name');
            
            if (select && select.value === '__new__') {
                if (newTenantDiv) newTenantDiv.style.display = 'block';
                if (newTenantInput) newTenantInput.required = true;
            } else {
                if (newTenantDiv) newTenantDiv.style.display = 'none';
                if (newTenantInput) {
                    newTenantInput.required = false;
                    newTenantInput.value = '';
                }
            }
        }
    </script>
</body>
</html>
