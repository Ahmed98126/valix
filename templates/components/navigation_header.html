<!-- Navigation Header Component -->
<nav class="bg-white shadow-sm border-b border-gray-200">
    <div class="max-w-full mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between h-16">
            <!-- Left side - Logo, Menu and Home -->
            <div class="flex">
                <!-- Menu button (mobile) -->
                <button id="toggle-sidebar" class="p-2 rounded-md text-gray-500 hover:text-gray-700 hover:bg-gray-100 focus:outline-none">
                    <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
                    </svg>
                </button>
                
                <!-- Logo -->
                <div class="flex-shrink-0 flex items-center ml-2">
                    <a href="/dashboard" class="flex items-center">
                        <img src="/static/images/valix-logo.svg" alt="Valix" class="h-8 w-auto">
                    </a>
                </div>
                
                <!-- Home button -->
                <div class="hidden sm:ml-6 sm:flex sm:space-x-4">
                    <a href="/dashboard" class="border-transparent text-gray-700 hover:text-blue-600 hover:border-blue-600 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium">
                        <svg class="w-5 h-5 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path>
                        </svg>
                        Home
                    </a>
                </div>
            </div>
            
            <!-- Right side - Page title and user info -->
            <div class="flex items-center">
                <!-- Page title (filled by JavaScript) -->
                <h1 id="page-title" class="text-xl font-semibold text-gray-800 mr-4">{{ page_title|default('') }}</h1>
                
                <!-- User dropdown -->
                <div class="ml-3 relative">
                    <div>
                        <button type="button" class="bg-white rounded-full flex text-sm focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500" id="user-menu-button" aria-expanded="false" aria-haspopup="true">
                            <span class="sr-only">Open user menu</span>
                            <div class="h-8 w-8 rounded-full bg-gray-800 flex items-center justify-center text-white">
                                {{ (user.full_name or user.email)[0].upper() if user else "U" }}
                            </div>
                        </button>
                    </div>
                    
                    <!-- Dropdown menu, hidden by default -->
                    <div class="origin-top-right absolute right-0 mt-2 w-48 rounded-md shadow-lg py-1 bg-white ring-1 ring-black ring-opacity-5 focus:outline-none hidden" id="user-dropdown" role="menu" aria-orientation="vertical" aria-labelledby="user-menu-button" tabindex="-1">
                        {% if user %}
                        <div class="px-4 py-2 text-sm text-gray-700 border-b">
                            <div class="font-medium">{{ user.full_name or user.email }}</div>
                            <div class="text-gray-500 truncate">{{ user.email }}</div>
                        </div>
                        <a href="/settings" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100" role="menuitem">Settings</a>
                        <a href="/logout" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100" role="menuitem">Sign out</a>
                        {% else %}
                        <a href="/login" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100" role="menuitem">Sign in</a>
                        {% endif %}
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Mobile menu, hidden by default -->
    <div class="sm:hidden" id="mobile-menu">
        <div class="pt-2 pb-3 space-y-1">
            <a href="/dashboard" class="bg-gray-50 border-blue-500 text-blue-700 block pl-3 pr-4 py-2 border-l-4 text-base font-medium">
                Home
            </a>
        </div>
    </div>
</nav>

<script>
    // Toggle user dropdown
    document.addEventListener('DOMContentLoaded', function() {
        const userMenuButton = document.getElementById('user-menu-button');
        const userDropdown = document.getElementById('user-dropdown');
        
        if (userMenuButton && userDropdown) {
            userMenuButton.addEventListener('click', function() {
                userDropdown.classList.toggle('hidden');
            });
            
            // Close dropdown when clicking outside
            document.addEventListener('click', function(event) {
                if (!userMenuButton.contains(event.target) && !userDropdown.contains(event.target)) {
                    userDropdown.classList.add('hidden');
                }
            });
        }
        
        // Set page title based on current page
        const pageTitle = document.getElementById('page-title');
        if (pageTitle) {
            // Get the current page title from the document title
            const docTitle = document.title.split(' - ')[0] || document.title;
            pageTitle.textContent = docTitle;
        }
    });
</script>
