<svg width="120" height="32" viewBox="0 0 120 32" xmlns="http://www.w3.org/2000/svg">
  <!-- Document/Paper with fold -->
  <g transform="translate(0, 4)">
    <!-- Main document -->
    <path d="M 2 0 L 18 0 L 18 20 L 2 20 Z" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Fold at top-right -->
    <path d="M 14 0 L 18 0 L 18 4" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Text lines inside document -->
    <line x1="4" y1="5" x2="12" y2="5" stroke="#FFFFFF" stroke-width="1" opacity="0.5"/>
    <line x1="4" y1="8" x2="10" y2="8" stroke="#FFFFFF" stroke-width="1" opacity="0.5"/>
    <!-- Golden-yellow checkmark -->
    <path d="M 5 12 L 8 15 L 15 8" fill="none" stroke="#FFD700" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Digital fragments/pixels emanating from top-right -->
    <g opacity="0.7">
      <rect x="16" y="2" width="1.5" height="1.5" fill="#FFD700"/>
      <rect x="18.5" y="1" width="1.5" height="1.5" fill="#FFD700"/>
      <rect x="17" y="4" width="1.5" height="1.5" fill="#FFD700"/>
      <rect x="19.5" y="3" width="1.5" height="1.5" fill="#FFD700"/>
      <rect x="17.5" y="6" width="1.5" height="1.5" fill="#FFD700"/>
      <rect x="20" y="5" width="1.5" height="1.5" fill="#FFD700"/>
    </g>
  </g>
  
  <!-- Valix Text -->
  <text x="26" y="20" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="600" fill="#FFFFFF" letter-spacing="-0.5">
    Valix
  </text>
</svg>

